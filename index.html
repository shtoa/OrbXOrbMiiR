  <script>
    
    
    // script for changing cursor visibility

    window.addEventListener("keydown", checkKeyPressed, false);
    window.addEventListener("mousedown", mouseCurDown,false);
    window.addEventListener("mouseup", mouseCurUp,false);
 

var isCursor = true;
function checkKeyPressed(evt) {
   if(evt.keyCode == "88"){

     document.documentElement.style.cursor = "url('/assets/html/cursors/cur.svg'),auto"; 
     isCursor = true;
   }
 
   if (evt.keyCode == "67") {
       if(isCursor){
         document.documentElement.style.cursor = 'none';
         isCursor = false;
        }
      }
}
   

function mouseCurDown() {
   if(isCursor){
   document.documentElement.style.cursor = "url('/assets/html/cursors/cur2.svg'),auto"; 
   }
}
function mouseCurUp() {
   if(isCursor){
   document.documentElement.style.cursor = "url('/assets/html/cursors/cur.svg'),auto"; 
   }
}

</script>
